name: CI/CD Pipeline - FastAPI Docker Hub (Lab 9.5 e 9.6)

on:
  push:
    branches: [main]
    paths:
      - '9.2_FastAPI/**'
      - '.github/workflows/deploy-fastapi-docker.yml'
  workflow_dispatch:

jobs:
  docker-build:
    name: Build e Push Imagem Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub (opcional se secrets existirem)
        if: "${{ env.DOCKERHUB_USERNAME != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da Imagem Docker (FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: ./9.2_FastAPI
          file: ./9.2_FastAPI/Dockerfile
          push: false
          tags: eduardofdem/lab09-fastapi:latest
